name: Bug report
description: The skill, build, or a generated guide did something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Guides document internal architecture. **Don't paste guide content, repo code, secrets, or personal data here.**
        Describe the problem in general terms, or reproduce it on the fixture app (`evals/_fixture/make-app.sh`).
  - type: dropdown
    id: area
    attributes:
      label: Where did it go wrong?
      options:
        - Skill workflow (phases, approvals, agents)
        - Scaffold (new_guide.py)
        - Build (build.py, layout, diagrams)
        - QA (qa_check.py)
        - Glossary scripts
        - Screenshots
        - The generated guide in the browser
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Build or QA output
      description: The last lines of `python3 build/build.py` and `qa_check.py`, with any internal names removed.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version (from `/plugin`), Claude Code version, Python version, OS, and browser.
      placeholder: "plugin 1.1.0 · Claude Code 2.1.x · Python 3.12 · macOS 15 · Chrome 141"
    validations:
      required: true
